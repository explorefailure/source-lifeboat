[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-lifeboat"
version = "0.1.0a1"
description = "Preserve GitHub release archives and assets in a dedicated Forgejo instance"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Source Lifeboat contributors"}]
dependencies = []

[project.scripts]
source-lifeboat = "repository_backup.server:main"
repository-backup = "repository_backup.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repository_backup = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
